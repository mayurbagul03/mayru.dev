name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build CSS
        run: |
          npm ci
          npm run build:css

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Upload code
        run: |
          rsync -avz --delete \
               --exclude '/.git' --exclude '/.github' --exclude '/node_modules' \
               --exclude '/netlify' --exclude '/.env' --exclude '/data' \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/portfolio/

      - name: Install deps & restart server
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /var/www/portfolio && npm ci --omit=dev && (pm2 restart portfolio || pm2 start server.js --name portfolio) && pm2 save"
